<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Webset</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
    body { background: #1d2b3a; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #fff; }
    .login-box { background: rgba(255,255,255,0.05); padding: 40px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); width: 100%; max-width: 350px; text-align: center; }
    h2 { margin-bottom: 20px; font-weight: 600; }
    .input { width: 100%; padding: 12px 15px; margin-bottom: 15px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2); color: #fff; outline: none; font-size: 15px; }
    .input:focus { border-color: #3f6fb0; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; background: #3f6fb0; color: #fff; font-weight: 600; font-size: 16px; cursor: pointer; transition: 0.2s; }
    .btn:active { transform: scale(0.98); }
    #error { color: #ff6b6b; font-size: 13px; margin-bottom: 10px; display: none; }
</style>
</head>
<body>

<div class="login-box">
    <h2>Login Webset</h2>
    <div id="error">Username atau password salah!</div>
    <input type="text" id="username" class="input" placeholder="Username">
    <input type="password" id="password" class="input" placeholder="Password">
    <button class="btn" onclick="loginWebset()">Masuk</button>
</div>

<script>
    async function loginWebset() {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const errorDiv = document.getElementById('error');
        
        errorDiv.style.display = 'none';

        if(!user || !pass) {
            errorDiv.innerText = "Isi username dan password!";
            errorDiv.style.display = 'block';
            return;
        }

        try {
            const res = await fetch('/api/auth', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user, password: pass })
            });
            
            const data = await res.json();
            
            if (data.success) {
                // SIMPEN WEB_ID SAMA USERNAME KE LOCAL STORAGE
                localStorage.setItem('web_session', data.web_id);
                localStorage.setItem('admin_user', data.username);
                window.location.href = '/dashboard.html';
            } else {
                errorDiv.innerText = data.error;
                errorDiv.style.display = 'block';
            }
        } catch (e) {
            errorDiv.innerText = "Error Koneksi: " + e.message;
            errorDiv.style.display = 'block';
        }
    }
</script>
</body>
</html>
